name: Scheduled Performance

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  GHCR_OWNER: ${{ github.repository_owner }}
  IMAGE_TAG: ${{ github.sha }}
  POSTGRES_PASSWORD: performance-postgres-password
  KEYCLOAK_ADMIN: performance-admin
  KEYCLOAK_ADMIN_PASSWORD: performance-admin-password
  KEYCLOAK_CLIENT_SECRET: performance-client-secret
  KEYCLOAK_TEST_USER: performance-user
  KEYCLOAK_TEST_PASSWORD: performance-test-password

jobs:
  performance:
    name: ${{ matrix.profile }} performance profile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [load, stress]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start isolated performance stack
        run: >-
          docker compose
          -f infrastructure/docker-compose/common.yml
          -f infrastructure/docker-compose/zookeeper.yml
          -f infrastructure/docker-compose/kafka_cluster.yml
          -f infrastructure/docker-compose/init_kafka.yml
          -f infrastructure/docker-compose/keycloak.yml
          -f infrastructure/docker-compose/services.yml
          up --build --wait

      - name: Run ${{ matrix.profile }} profile
        run: ./scripts/run-performance.sh ${{ matrix.profile }} performance/results

      - name: Upload ${{ matrix.profile }} performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.profile }}-performance-reports
          path: performance/results/${{ matrix.profile }}-*.json
          if-no-files-found: warn

      - name: Stop isolated performance stack
        if: always()
        run: >-
          docker compose
          -f infrastructure/docker-compose/common.yml
          -f infrastructure/docker-compose/zookeeper.yml
          -f infrastructure/docker-compose/kafka_cluster.yml
          -f infrastructure/docker-compose/init_kafka.yml
          -f infrastructure/docker-compose/keycloak.yml
          -f infrastructure/docker-compose/services.yml
          down --volumes --remove-orphans
